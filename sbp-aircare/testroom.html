<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#0f141b}#v{width:900px;height:560px}</style>
<div id="v"></div><pre id="o" style="color:#fff;position:fixed;top:0;left:0;margin:0;font:12px monospace"></pre>
<script type="module">
import {createRoomSim} from './assets/ac3d.js';
window.R = createRoomSim(document.getElementById('v'),{onStats:s=>{document.getElementById('o').textContent=JSON.stringify({T:s.T.toFixed(2),min:s.simMin.toFixed(1),reached:s.reached,need:s.need})}});

</script>
