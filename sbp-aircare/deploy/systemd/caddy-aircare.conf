# SBP AirCare — settings for the official Caddy package's service (plain Ubuntu install only; Docker does not use this).
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/systemd/caddy-aircare.conf /etc/systemd/system/caddy.service.d/aircare.conf
#   sudo nano /etc/systemd/system/caddy.service.d/aircare.conf      (put the real domain and e-mail)
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
# The Caddyfile (deploy/Caddyfile → /etc/caddy/Caddyfile) reads these; APP_UPSTREAM defaults to 127.0.0.1:8080.
[Service]
Environment=SITE_DOMAIN=example.co.th
Environment=ACME_EMAIL=it@example.co.th
