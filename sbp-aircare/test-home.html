<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/shared.css"><style>html,body{margin:0;background:#eef1f4}#s{position:relative;width:100vw;height:100vh}</style></head><body><div id="s"></div>
<script type="module">
import { createStage, buildHome, createLabels } from './assets/install3d.js';
const q = new URLSearchParams(location.search);
const st = createStage(document.getElementById('s'), { theme: q.get('theme') || 'light', drift: false });
const home = buildHome(st.scene, { type: q.get('type') || 'wall', theme: q.get('theme') || 'light' });
const views = { wide: { t: [0.9, 1.0, -0.4], r: 8.6, th: 0.42, ph: 1.2 }, trunk: { t: [2.6, 1.6, -1.8], r: 3.2, th: 0.5, ph: 1.3 }, cdu: { t: [3.9, 0.5, -1.7], r: 2.0, th: 0.55, ph: 1.25 }, unit: { t: [0.9, 2.1, -1.8], r: 2.2, th: 0.2, ph: 1.35 }, top: { t: [0.9, 1.0, -0.4], r: 9, th: 0.3, ph: 0.6 } };
const v = views[q.get('view') || 'wide']; st.flyTo(v, 0);
if (q.get('lid') === '0') { home.trunk.lid.visible = false; home.trunk.fit.visible = false; }
if (q.get('xray')) home.setXray(+q.get('xray'));
const L = createLabels(document.getElementById('s'));
const A = home.anchors;
L.set([{ text: 'คอยล์เย็น', at: A.unit }, { text: 'รางครอบท่อ Airpro 75 มม.', at: A.trunkIn }, { text: 'ข้องอฉาก (มุมใน)', at: A.corner }, { text: 'ข้องอแบน 90°', at: A.flat }, { text: 'คอยล์ร้อน', at: A.cdu }, { text: 'วาล์วบริการ + แฟลร์นัต', at: A.valves }, { text: 'ท่อน้ำทิ้ง PVC สีฟ้า', at: A.drainEnd }, { text: 'เบรกเกอร์ RCBO', at: A.rcbo }, { text: 'ฉนวน Aeroflex', at: A.insul }]);
st.onAfter((c, W, H) => L.update(c, W, H));
window.__home = home; window.__st = st; window.__ok = true;
</script></body></html>
