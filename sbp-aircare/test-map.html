<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/shared.css">
<style>:root{--s-card:#fff;--s-card-2:#f3f6f9;--s-ink:#10233a;--s-ink-2:#34495e;--s-ink-3:#667789;--s-line:#dbe3ea;--s-accent:#1b5aa8;--s-ok:#1f8a4c;--s-warn:#b86e00;--s-bad:#c0392b;--s-r:12px;--s-mono:ui-monospace,monospace}
body{margin:0;font-family:Anuphan,system-ui;background:#eef2f6;padding:16px}body.dk{--s-card:#111a24;--s-card-2:#0c131b;--s-ink:#eaf0f6;--s-ink-2:#c3cfdb;--s-ink-3:#8797a8;--s-line:#223142;--s-accent:#ff8a3d;background:#070b10}</style></head>
<body><div id="m" style="max-width:900px"></div>
<script type="module">
import { loadData, checkZone } from './assets/sbp-core.js';
import { mountThaiMap } from './assets/thaimap3d.js';
const q = new URLSearchParams(location.search); if (q.get('theme') === 'dark') document.body.classList.add('dk');
await loadData();
window.MAP = await mountThaiMap(document.getElementById('m'), { theme: q.get('theme') || 'light', onPick: th => console.log('pick', th) });
if (q.get('z')) setTimeout(() => MAP.highlight(checkZone(q.get('z'))), 2500);
window.READY = true;
</script></body></html>
